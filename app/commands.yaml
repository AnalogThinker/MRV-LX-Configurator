  version: {label: "Software version", group: "System", command: "show version", poll: false, parser: generic_keyvalue}
  clock: {label: "System clock", group: "System", command: "show clock", poll: true, interval: 30}
  dashboard: {label: "Dashboard status", group: "System", command: "show dashboard", poll: true, interval: 10}
  interface: {label: "Interface status/config", group: "Network", command: "show interface", poll: true, interval: 20}
  port_async_summary: {label: "Async ports summary", group: "Ports", command: "show port async summary", poll: true, interval: 15, parser: port_async_summary}
