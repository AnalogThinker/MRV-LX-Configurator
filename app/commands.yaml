  service: {label: "Configured services", group: "Services", command: "show service", poll: false}
  session: {label: "Open connections", group: "Sessions & users", command: "show session", poll: true, interval: 20}
  users: {label: "Connected users", group: "Sessions & users", command: "show users", poll: true, interval: 30}
  subscriber: {label: "Subscriber information", group: "Sessions & users", command: "show subscriber", poll: false}
